<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#080e1d" />
      <stop offset="100%" stop-color="#050812" />
    </linearGradient>

    <!-- Verma Text Gradient -->
    <linearGradient id="vermaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Glowing Line Gradients -->
    <linearGradient id="glowLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#60a5fa" stop-opacity="1" />
      <stop offset="75%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Radial Glow for Orb -->
    <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="30%" stop-color="#0284c7" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#0369a1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#080e1d" stop-opacity="0" />
    </radialGradient>

    <!-- Glow Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="orbPulseFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="15" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.15); opacity: 1; }
      }
      @keyframes floatRing {
        0%, 100% { opacity: 0.25; transform: rotate(0deg); }
        50% { opacity: 0.45; transform: rotate(180deg); }
      }
      .pulsing-orb {
        transform-origin: 825px 115px;
        animation: pulse 3s ease-in-out infinite;
      }
      .orbit-ring {
        transform-origin: 825px 115px;
        animation: floatRing 12s linear infinite;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: 4px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        letter-spacing: 3.5px;
        font-size: 13px;
        fill: #8b9cb3;
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="946" height="236" rx="16" fill="url(#bgGrad)" stroke="#162032" stroke-width="1.5" />

  <!-- Cybernetic Border Highlights (Top & Bottom Glowing Lines) -->
  <line x1="120" y1="2" x2="830" y2="2" stroke="url(#glowLineGrad)" stroke-width="2" filter="url(#neonGlow)" />
  <line x1="120" y1="238" x2="830" y2="238" stroke="url(#glowLineGrad)" stroke-width="2" filter="url(#neonGlow)" />

  <!-- Top-Left Corner Accent -->
  <path d="M 18 20 L 35 20 M 20 18 L 20 35" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" filter="url(#neonGlow)" />
  <!-- Bottom-Left Corner Accent -->
  <path d="M 18 220 L 35 220 M 20 222 L 20 205" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" filter="url(#neonGlow)" />
  <!-- Top-Right Corner Accent -->
  <path d="M 932 20 L 915 20 M 930 18 L 930 35" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" filter="url(#neonGlow)" />
  <!-- Bottom-Right Corner Accent -->
  <path d="M 932 220 L 915 220 M 930 222 L 930 205" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" filter="url(#neonGlow)" />

  <!-- Side Accent Ticks -->
  <line x1="2" y1="90" x2="2" y2="150" stroke="#38bdf8" stroke-width="2" opacity="0.6" filter="url(#neonGlow)" />
  <line x1="948" y1="90" x2="948" y2="150" stroke="#38bdf8" stroke-width="2" opacity="0.6" filter="url(#neonGlow)" />

  <!-- Background Radar / Orbit Graphic (Right Side) -->
  <g class="orbit-ring">
    <circle cx="825" cy="115" r="95" fill="none" stroke="#0e223d" stroke-width="1.5" stroke-dasharray="6,8" />
    <circle cx="825" cy="115" r="65" fill="#091426" fill-opacity="0.5" stroke="#132d52" stroke-width="1.2" />
  </g>

  <!-- Glowing Neon Blue Dot / Orb on Orbit -->
  <g class="pulsing-orb">
    <circle cx="825" cy="115" r="32" fill="url(#orbGlow)" />
    <circle cx="825" cy="115" r="6" fill="#38bdf8" filter="url(#orbPulseFilter)" />
    <circle cx="825" cy="115" r="2.5" fill="#ffffff" />
  </g>

  <!-- Title Text -->
  <g transform="translate(475, 115)">
    <text text-anchor="middle" class="title-text" font-size="42">
      <tspan fill="#ffffff">PRATEEK </tspan>
      <tspan fill="url(#vermaGrad)">VERMA</tspan>
    </text>
    <!-- Subtitle Text -->
    <text y="38" text-anchor="middle" class="subtitle-text">
      FULL STACK DEVELOPER • BUILDING REAL-TIME PRODUCTS
    </text>
  </g>
</svg>
