<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 92" width="100%" height="100%">
  <defs>
    <style>
      .tech-card {
        fill: #0b101b;
        stroke: #162032;
        stroke-width: 1.2;
        transition: stroke 0.3s ease, transform 0.3s ease;
      }
      .tech-card:hover {
        stroke: #38bdf8;
      }
      .tech-name {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 11.5px;
        font-weight: 500;
        fill: #cbd5e1;
        text-anchor: middle;
      }
    </style>
  </defs>

  <!-- 1. JavaScript (x: 0) -->
  <g transform="translate(0, 0)">
    <rect width="92" height="92" rx="10" class="tech-card" />
    <!-- JS Icon -->
    <g transform="translate(32, 18)">
      <rect width="28" height="28" rx="4" fill="#F7DF1E" />
      <path d="M 12 18 C 12 21 14 23 17 23 C 19 23 20 22 20 20 L 20 12 L 18 12 L 18 20 C 18 21 17 21.5 16 21.5 C 15 21.5 14.5 21 14.5 19.5 Z" fill="#000000" />
      <path d="M 21.5 20 C 22.5 21 24 21.5 25.5 21.5 C 27.5 21.5 28.5 20.5 28.5 19 C 28.5 15.5 22 17 22 13.5 C 22 12 23.5 11 25.5 11 C 27 11 28 11.5 28.8 12.5 L 27.5 13.8 C 26.8 13.2 26 12.8 25.2 12.8 C 24.2 12.8 23.8 13.2 23.8 13.8 C 23.8 16.5 30.2 15.2 30.2 19 C 30.2 21.2 28.2 22.8 25.5 22.8 C 23.8 22.8 22.5 22 21.5 21 Z" fill="#000000" />
    </g>
    <text x="46" y="72" class="tech-name">JavaScript</text>
  </g>

  <!-- 2. React (x: 107) -->
  <g transform="translate(107, 0)">
    <rect width="92" height="92" rx="10" class="tech-card" />
    <!-- React Icon -->
    <g transform="translate(46, 32)">
      <ellipse rx="15" ry="5.8" fill="none" stroke="#00d8ff" stroke-width="1.6" />
      <ellipse rx="15" ry="5.8" fill="none" stroke="#00d8ff" stroke-width="1.6" transform="rotate(60)" />
      <ellipse rx="15" ry="5.8" fill="none" stroke="#00d8ff" stroke-width="1.6" transform="rotate(120)" />
      <circle r="3" fill="#00d8ff" />
    </g>
    <text x="46" y="72" class="tech-name">React</text>
  </g>

  <!-- 3. Node.js (x: 214) -->
  <g transform="translate(214, 0)">
    <rect width="92" height="92" rx="10" class="tech-card" />
    <!-- Node.js Icon -->
    <g transform="translate(32, 17)">
      <path d="M 14 2 L 27 9.5 L 27 24.5 L 14 32 L 1 24.5 L 1 9.5 Z" fill="none" stroke="#22c55e" stroke-width="2" stroke-linejoin="round" />
      <path d="M 8 13 L 20 13 L 20 16 L 14 16 L 14 19 L 19 19 L 19 22 L 8 22 Z" fill="#22c55e" />
    </g>
    <text x="46" y="72" class="tech-name">Node.js</text>
  </g>

  <!-- 4. Express (x: 321) -->
  <g transform="translate(321, 0)">
    <rect width="92" height="92" rx="10" class="tech-card" />
    <!-- Express Icon (ex in rounded circle) -->
    <g transform="translate(46, 32)">
      <circle r="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">ex</text>
    </g>
    <text x="46" y="72" class="tech-name">Express</text>
  </g>

  <!-- 5. MongoDB (x: 428) -->
  <g transform="translate(428, 0)">
    <rect width="92" height="92" rx="10" class="tech-card" />
    <!-- MongoDB Leaf Icon -->
    <g transform="translate(46, 32)">
      <path d="M 0 -15 C 6 -8 11 0 11 7 C 11 14 6 18 0 20 C -6 18 -11 14 -11 7 C -11 0 -6 -8 0 -15 Z" fill="#10aa50" />
      <path d="M 0 -15 L 0 20 C -6 18 -11 14 -11 7 C -11 0 -6 -8 0 -15 Z" fill="#139243" />
      <line x1="0" y1="-15" x2="0" y2="20" stroke="#0e6b32" stroke-width="0.8" />
    </g>
    <text x="46" y="72" class="tech-name">MongoDB</text>
  </g>

  <!-- 6. Next.js (x: 535) -->
  <g transform="translate(535, 0)">
    <rect width="92" height="92" rx="10" class="tech-card" />
    <!-- Next.js Icon -->
    <g transform="translate(46, 32)">
      <circle r="14" fill="#000000" stroke="#334155" stroke-width="1.2" />
      <!-- Stylized Next 'N' -->
      <path d="M -6 7 L -6 -7 L -3 -7 L 4 4.5 L 4 -7 L 6 -7 L 6 7 L 3.5 7 L -4 -4 L -4 7 Z" fill="#ffffff" />
    </g>
    <text x="46" y="72" class="tech-name">Next.js</text>
  </g>

  <!-- 7. Socket.IO (x: 642) -->
  <g transform="translate(642, 0)">
    <rect width="92" height="92" rx="10" class="tech-card" />
    <!-- Socket.IO Lightning Icon -->
    <g transform="translate(46, 32)">
      <circle r="14" fill="#ffffff" />
      <path d="M -1 -9 L -8 0 L -1 0 L -3 9 L 7 -1 L 0 -1 Z" fill="#010101" />
    </g>
    <text x="46" y="72" class="tech-name">Socket.IO</text>
  </g>

  <!-- 8. Git (x: 749) -->
  <g transform="translate(749, 0)">
    <rect width="92" height="92" rx="10" class="tech-card" />
    <!-- Git Branch Icon -->
    <g transform="translate(46, 32)">
      <rect x="-11" y="-11" width="22" height="22" rx="4" fill="#f05032" transform="rotate(45)" />
      <circle cx="-3" cy="-3" r="2.2" fill="#ffffff" />
      <circle cx="3" cy="3" r="2.2" fill="#ffffff" />
      <circle cx="3" cy="-3" r="2.2" fill="#ffffff" />
      <line x1="-3" y1="-3" x2="3" y2="3" stroke="#ffffff" stroke-width="1.5" />
      <line x1="-3" y1="-3" x2="3" y2="-3" stroke="#ffffff" stroke-width="1.5" />
    </g>
    <text x="46" y="72" class="tech-name">Git</text>
  </g>

  <!-- 9. Docker (x: 856) -->
  <g transform="translate(856, 0)">
    <rect width="92" height="92" rx="10" class="tech-card" />
    <!-- Docker Whale Icon -->
    <g transform="translate(32, 19)">
      <!-- Containers -->
      <rect x="4" y="6" width="3.5" height="3" fill="#2496ed" />
      <rect x="9" y="6" width="3.5" height="3" fill="#2496ed" />
      <rect x="14" y="6" width="3.5" height="3" fill="#2496ed" />
      <rect x="9" y="2" width="3.5" height="3" fill="#2496ed" />
      <rect x="14" y="2" width="3.5" height="3" fill="#2496ed" />
      <!-- Whale Body -->
      <path d="M 27 10 C 26 9.5 24 10 23 10.5 C 21 8.5 19 8.5 19 9 L 2 9 C 1 12 1.5 16 5 18 C 10 20.5 19 20.5 24 17 C 27 15 28 12 28 11 Z" fill="#2496ed" />
      <circle cx="6" cy="14" r="0.8" fill="#ffffff" />
    </g>
    <text x="46" y="72" class="tech-name">Docker</text>
  </g>
</svg>
